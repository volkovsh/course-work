# Запуск: docker compose up --build
# Игра: http://localhost/ (nginx → app:8080)
# Прямой доступ к backend: http://localhost:8080/

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game2048
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: game2048
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-in-production-32bytes
      STORAGE_ROOT: /app/storage_data
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  storage_data:
