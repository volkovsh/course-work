spring:
  application:
    name: game-2048

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game2048}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 1MB

server:
  port: ${SERVER_PORT:8080}
  # Без context-path: игра и API на одном порту (http://localhost:8080)

# JWT
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-please}
  expiration-ms: 86400000  # 24 часа

# CORS (для фронтенда)
app:
  cors-allowed-origins: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500
  access-control:
    enabled: true
    config-path: classpath:security-access.json
    auth-rate-limit-per-minute: 30
  storage:
    root: ${STORAGE_ROOT:storage_data}
    max-avatar-bytes: 1048576
    max-save-bytes: 65536

logging:
  level:
    http.access: INFO
