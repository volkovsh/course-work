# Альтернатива: MySQL (раскомментировать в application.yml или запускать с -Dspring.profiles.active=mysql)
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:game2048}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Europe/Minsk
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
